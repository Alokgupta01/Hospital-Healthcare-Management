
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors - HHMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/doctors.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="../index.html"><span class="brand-mark">+</span>HHMS</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu">&#9776;</label>
    <nav class="nav-links"><a href="../index.html">Home</a><a href="patients.html">Patients</a><a href="records.html">Records</a><a href="doctors.html" class="active">Doctors</a><a href="appointments.html">Appointments</a><a href="billing.html">Billing</a><a href="admin.html">Admin</a></nav>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Doctors</h1>
        <p>Find a doctor by department and check who is available today.</p>
      </div>
      <a class="btn btn-primary" href="#add-doctor">Add doctor</a>
    </div>

    <div id="msg" class="alert"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search doctor by name" aria-label="Search doctors">
      <div class="chips" id="chips"></div>
    </div>

    <section class="grid cols-3 mb" id="doctorGrid"></section>

    <section class="card">
      <h2>Weekly duty roster</h2>
      <div class="table-wrap">
        <table class="roster">
          <thead>
            <tr><th>Doctor</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>
          </thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add doctor popup -->
  <div class="modal" id="add-doctor">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Add doctor</h2>
        <a class="modal-close" href="#" aria-label="Close">&times;</a>
      </div>
      <div id="formMsg" class="alert"></div>
      <form id="doctorForm" onsubmit="return false;">
        <div class="form-grid">
          <div class="field full"><label for="d-name">Full name</label><input id="d-name" type="text" placeholder="e.g. Dr. Meera Iyer"></div>
          <div class="field"><label for="d-dept">Department</label>
            <select id="d-dept"><option>Cardiology</option><option>Orthopedics</option><option>Pediatrics</option><option>General medicine</option><option>Dermatology</option></select>
          </div>
          <div class="field"><label for="d-exp">Experience (years)</label><input id="d-exp" type="number" min="0"></div>
          <div class="field"><label for="d-fee">Consultation fee (&#8377;)</label><input id="d-fee" type="number" min="0"></div>
          <div class="field"><label for="d-phone">Phone</label><input id="d-phone" type="tel" maxlength="10" placeholder="10-digit number"></div>
          <div class="field"><label for="d-from">Available from</label><input id="d-from" type="time"></div>
          <div class="field"><label for="d-to">Available till</label><input id="d-to" type="time"></div>
        </div>
        <div class="modal-actions">
          <a class="btn btn-outline" href="#">Cancel</a>
          <button class="btn btn-primary" type="button" id="saveBtn">Save doctor</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">HHMS - Hospital and Healthcare Management System &middot; GLA University, Mathura</footer>
  <script src="../js/common.js"></script>
  <script src="../js/doctors.js"></script>
</body>
</html>
