<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients - HHMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/patients.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="../index.html"><span class="brand-mark">+</span>HHMS</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu">&#9776;</label>
    <nav class="nav-links"><a href="../index.html">Home</a><a href="patients.html" class="active">Patients</a><a href="records.html">Records</a><a href="doctors.html">Doctors</a><a href="appointments.html">Appointments</a><a href="billing.html">Billing</a><a href="admin.html">Admin</a></nav>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Patients</h1>
        <p>Search, register and manage patient details.</p>
      </div>
      <a class="btn btn-primary" id="newBtn" href="#add-patient">Register new patient</a>
    </div>

    <div id="msg" class="alert"></div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search by name, ID or phone" aria-label="Search patients">
        <div class="chips" id="chips"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Patient</th><th>Age / Gender</th><th>Blood group</th><th>Phone</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="patientBody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span class="muted" id="countText"></span>
      </div>
    </div>
  </main>
  
  <div class="modal" id="add-patient">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Register new patient</h2>
        <a class="modal-close" href="#" aria-label="Close">&times;</a>
      </div>
      <div id="formMsg" class="alert"></div>
      <form id="patientForm" onsubmit="return false;">
        <div class="form-grid">
          <div class="field full"><label for="p-name">Full name</label><input id="p-name" type="text" placeholder="e.g. Rohan Sharma"></div>
          <div class="field"><label for="p-age">Age</label><input id="p-age" type="number" min="0" max="120"></div>
          <div class="field"><label for="p-gender">Gender</label>
            <select id="p-gender"><option>Male</option><option>Female</option><option>Other</option></select>
          </div>
          <div class="field"><label for="p-blood">Blood group</label>
            <select id="p-blood"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
          </div>
          <div class="field"><label for="p-phone">Phone</label><input id="p-phone" type="tel" placeholder="10-digit number" maxlength="10"></div>
          <div class="field"><label for="p-status">Status</label>
            <select id="p-status"><option>Outpatient</option><option>Admitted</option><option>Discharged</option></select>
          </div>
          <div class="field full"><label for="p-address">Address</label><textarea id="p-address" placeholder="House no, street, city"></textarea></div>
          <div class="field full"><label for="p-history">Medical history / allergies (optional)</label><textarea id="p-history" placeholder="e.g. Diabetes, allergic to penicillin"></textarea></div>
        </div>
        <div class="modal-actions">
          <a class="btn btn-outline" href="#">Cancel</a>
          <button class="btn btn-primary" type="button" id="saveBtn">Save patient</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">HHMS - Hospital and Healthcare Management System &middot; GLA University, Mathura</footer>
  <script src="../js/common.js"></script>
  <script src="../js/patients.js"></script>
</body>
</html>
